- id: agentguard
  name: Agent Guard
  description: Scan agent skills, plugins, instruction files, agent settings and MCP configuration (never executes scanned code).
  entry: agentguard scan --profile quick --llm off --context none --fail-on review
  language: python
  pass_filenames: false
  always_run: false
  files: '(SKILL\.md|AGENTS(\.override)?\.md|CLAUDE(\.local)?\.md|GEMINI\.md|\.cursorrules|\.mdc|\.mcp\.json|mcp\.json|server\.json|hooks\.json|\.agentguard\.yaml|\.claude/|\.cursor/|\.codex/|\.gemini/|\.agents/|\.claude-plugin/|\.codex-plugin/|\.cursor-plugin/|\.github/(agents|hooks|skills|instructions)/)'
