# Example: scan agent skills, plugins, settings and MCP configs on every pull request; fail on a BLOCK
# verdict, annotate the changed lines and show findings as GitHub code scanning alerts.
# Copy to .github/workflows/.
name: Agent Guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  agentguard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0             # pull-request mode diffs the base and head commits
          persist-credentials: false
      - uses: ak2dev/agentguard@v0.1.0   # pin to a release tag or commit SHA
        with:
          targets: .
          policy: balanced           # strict also fails on REVIEW
          fail-on: block
