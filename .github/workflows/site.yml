name: Website

# Builds the site exactly as Vercel does (vercel.json) and runs the generated-data
# and CSP / inline-script / SRI gates. Deployment is Vercel's Git integration,
# configured by vercel.json; this workflow never deploys.

on:
  push:
    branches: [main]
    paths: ["site/**", "rules/**", "mappings/**", "bench/results/**", "src/agentguard/**", "scripts/gen_site_data.py", "vercel.json"]
  pull_request:
    paths: ["site/**", "rules/**", "mappings/**", "bench/results/**", "src/agentguard/**", "scripts/gen_site_data.py", "vercel.json"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Generated site data is up to date
        run: |
          python -m pip install --disable-pip-version-check "uv==0.12.23" && uv sync --frozen --group dev
          uv run python scripts/gen_site_data.py
          git diff --exit-code -- site/src/data/generated schemas
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Build as deployed (includes the CSP / inline-script / SRI gate)
        working-directory: site
        env:
          PUBLIC_FEATURE_SCAN: "1"
        run: |
          npm ci --no-audit --no-fund
          npm run build
