name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "uv==0.12.23"
      - name: Test before release
        run: uv sync --frozen --group dev && uv run pytest -q
      - name: Build sdist and wheel
        run: uv build
      - name: SBOM (CycloneDX) for the release
        run: uvx --from "cyclonedx-bom==7.1.0" cyclonedx-py environment --output-format JSON --output-file dist/agentguard.cdx.json .venv
      - name: Rule pack bundle
        run: |
          tar --sort=name --mtime='2026-01-01' --owner=0 --group=0 --numeric-owner -czf dist/agentguard-rulepack.tgz rules mappings
          sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  sign-and-publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write      # Sigstore keyless signing + PyPI trusted publishing
      contents: write      # attach signed artifacts to the GitHub release
      attestations: write  # build provenance for `gh attestation verify`
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/agentguard.cdx.json
            dist/agentguard-rulepack.tgz
      - name: Sign with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./dist/*.whl ./dist/*.tar.gz ./dist/agentguard.cdx.json ./dist/agentguard-rulepack.tgz ./dist/SHA256SUMS
          release-signing-artifacts: true
      # twine rejects anything that is not a wheel or sdist (the SBOM, rule pack, sums, Sigstore bundles).
      - name: Stage the wheel and sdist for PyPI
        run: mkdir pypi && cp dist/*.whl dist/*.tar.gz pypi/
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: pypi/
          skip-existing: true
