family: PLUG
name: Plugins, extensions and marketplaces
defaults: {category: vulnerability, lane: block, confidence: high, engine: config}
mappings:
  owasp-ast-1.0: [AST02, AST07]
  owasp-mcp-2025-beta: ["MCP04:2025"]
  owasp-asi-2026: [ASI04]
  owasp-llm-2026: ["LLM04:2026"]
  nsa-csi-mcp-2026-05: []
  cwe: []
rules:
  - [AG-PLUG-001, M, A, "Marketplace source on a mutable ref (branch or tag, no commit SHA)"]
  - [AG-PLUG-002, M, A, "npm source with a range or dist-tag"]
  - [AG-PLUG-003, H, A, "Archive source without `sha256`", {mappings: {cwe: [CWE-494]}}]
  - [AG-PLUG-004, H, G, "`command` source (runs on install, on update and every session)"]
  - [AG-PLUG-005, H, G, "Marketplace entry with `headersHelper`"]
  - [AG-PLUG-006, M, A, "Auto-update enabled for a third-party marketplace"]
  - [AG-PLUG-007, M, G, "Plugin ships hooks not mentioned in its description", {lane: evidence, confidence: medium}]
  - [AG-PLUG-008, M, G, "Plugin ships MCP, LSP or monitor servers not mentioned in its description", {lane: evidence, confidence: medium}]
  - [AG-PLUG-009, M, G, "Plugin ships in-process code (workflows, mods, `bin/`) not mentioned in its description", {lane: evidence, confidence: medium}]
  - [AG-PLUG-010, M, G, "Dependency on a plugin from another marketplace", {lane: evidence}]
  - [AG-PLUG-011, H, X, "Manifest path or symlink leaves the plugin root", {category: malice, mappings: {cwe: [CWE-22]}}]
  - [AG-PLUG-012, M, G, "Marketplace entry overrides the plugin's own components (`strict: false`)", {lane: evidence}]
  - [AG-PLUG-013, H, X, "Marketplace or plugin name imitates an official or reserved name", {category: malice}]
  - [AG-PLUG-014, M, G, "Plugin `settings.json` sets a status-line command or default agent"]
  - [AG-PLUG-015, M, A, "`userConfig` collects a secret without `sensitive: true`"]
  - [AG-PLUG-016, var, P, "Plugin `package.json` dependencies with findings", {engine: supply, lane: evidence}]
  - [AG-PLUG-017, H, X, "Same version number, different content from the baseline", {category: malice, engine: supply}]
  - [AG-PLUG-018, H, A, "MCP bundle referenced by URL with no hash", {mappings: {cwe: [CWE-494]}}]
  - [AG-PLUG-019, M, G, "Component auto-starts at session start with network access", {lane: evidence, confidence: medium}]
  - [AG-PLUG-020, M, G, "`renames` or forced removal used to swap plugin identity", {lane: evidence}]
  - [AG-PLUG-021, M, G, "Channel plugin accepts inbound messages from untrusted senders", {lane: evidence}]
  - [AG-PLUG-022, M, G, "Equivalent findings in Cursor, Codex and Gemini extension manifests (auto-update, `migratedTo` redirect, bundled hooks and servers)", {lane: evidence}]
  - [AG-PLUG-023, L, A, "High-risk plugin enabled by default", {lane: evidence}]
