family: SUPPLY
name: Supply chain and provenance
defaults: {category: vulnerability, lane: evidence, confidence: high, engine: supply}
mappings:
  owasp-ast-1.0: [AST02, AST05, AST07]
  owasp-mcp-2025-beta: ["MCP04:2025"]
  owasp-asi-2026: [ASI04]
  owasp-llm-2026: ["LLM04:2026"]
  nsa-csi-mcp-2026-05: [recommendations/track-and-patch]
  cwe: [CWE-829]
  skilltrustbench: [T03, T08]
rules:
  - [AG-SUPPLY-001, var, A, "Dependency with a known vulnerability", {lane: block, network: true}]
  - [AG-SUPPLY-002, C, X, "Dependency flagged as malicious", {category: malice, lane: block, engine: intel}]
  - [AG-SUPPLY-003, H, X, "Typosquat of a popular package", {category: malice, lane: block, confidence: medium}]
  - [AG-SUPPLY-004, H, X, "Package name that does not exist on its registry", {category: malice, lane: block, network: true}]
  - [AG-SUPPLY-005, M, A, "Unpinned dependency ranges or no lockfile"]
  - [AG-SUPPLY-006, M, A, "Dependency from a URL or git ref with no commit pin"]
  - [AG-SUPPLY-007, H, P, "Dependency confusion (private name, custom index)", {lane: block, confidence: medium}]
  - [AG-SUPPLY-008, M, G, "Dependency with install scripts"]
  - [AG-SUPPLY-009, H, P, "Code or instructions fetched at run time from a mutable URL", {lane: block, confidence: medium, mappings: {cwe: [CWE-494]}}]
  - [AG-SUPPLY-010, M, P, "External document referenced by instructions with no content pin", {confidence: medium}]
  - [AG-SUPPLY-011, H, X, "URL shortener, paste site, personal file host, raw IP or punycode domain", {category: malice, confidence: medium}]
  - [AG-SUPPLY-012, M, G, "Newly registered or low-reputation domain", {confidence: medium, network: true}]
  - [AG-SUPPLY-013, L, G, "No provenance or attestation where the ecosystem supports one", {category: hygiene, lane: hunt, network: true}]
  - [AG-SUPPLY-014, H, X, "Signature or attestation verification failed", {category: malice, lane: block, network: true, mappings: {cwe: [CWE-494]}}]
  - [AG-SUPPLY-015, M, G, "Publisher signals: new account, mass publishing, ownership change, resurrected repository", {confidence: medium, network: true}]
  - [AG-SUPPLY-016, H, X, "Published package differs from its source repository at the tagged commit", {category: malice, lane: block, network: true}]
  - [AG-SUPPLY-017, C, X, "Hash, domain or other indicator matches a known campaign", {category: malice, lane: block, engine: intel, mappings: {cwe: [CWE-506]}}]
  - [AG-SUPPLY-018, L, G, "Abandoned or archived source", {category: hygiene, lane: hunt, network: true}]
  - [AG-SUPPLY-019, M, G, "Vendored third-party code modified from upstream", {confidence: medium}]
  - [AG-SUPPLY-020, M, G, "Git submodule with an insecure URL, no pin, or not scanned"]
  - [AG-SUPPLY-021, I, G, "Licence missing or unclear", {category: hygiene, lane: hunt}]
  - [AG-SUPPLY-022, M, A, "GitHub Action in an agent workflow not pinned to a commit", {engine: config}]
  - [AG-SUPPLY-023, M, G, "Binary artifact with no source"]
  - [AG-SUPPLY-024, H, X, "Lockfile entries point at unexpected URLs or fail integrity", {category: malice, lane: block}]
  - [AG-SUPPLY-025, M, G, "Installed from a source its own marketplace marks as unscanned"]
