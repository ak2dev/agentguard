# MCP tool / prompt / resource metadata. Sources: static manifests,
# server.json, tool registrations extracted from source, or opt-in read-only
# */list calls. tools/call is never made.
rules:
  - id: AG-MCP-META-001
    version: 1
    title: Hidden Unicode in MCP metadata
    description: Tool, parameter, prompt or resource metadata contains tag characters, bidi controls, zero-width characters or mixed-script words.
    why: Models read hidden characters that humans approving the server cannot see.
    severity: high
    confidence: high
    match: {type: analyzer, analyzer: text.hidden}
    remediation: Remove hidden characters from metadata.

  - id: AG-MCP-META-002
    version: 1
    title: Instructions hidden in tool descriptions (tool poisoning)
    description: A tool or parameter description contains directives aimed at the model (override, concealment, "before using this tool…", pseudo-tags like <IMPORTANT>).
    why: Tool descriptions are injected into the model's context for every conversation; instructions there act on every request (tool poisoning).
    severity: high
    confidence: medium
    applies_to: [tool, tool_param]
    match:
      type: regex
      scopes: [tool_text]
      patterns:
        - |-
          <\s*/?\s*(?:IMPORTANT|SYSTEM|INSTRUCTIONS?|HIDDEN|SECRET|ADMIN|CRITICAL)\s*>
        - |-
          \b(?:ignore|disregard|forget|override|bypass)\s+(?:all\s+|any\s+|the\s+|your\s+)?(?:previous|prior|above|earlier|system|safety|other|user'?s?)\s+(?:instructions?|prompts?|rules?|guidelines?|tools?|requests?)
        - |-
          \b(?:do\s+not|don'?t|never)\s+(?:tell|inform|notify|alert|mention|reveal|show)\b[^\n.]{0,40}\b(?:user|human|operator)\b
        - |-
          \b(?:before|prior\s+to)\s+(?:using|calling|invoking|running)\s+(?:this|any|the)\s+(?:tool|function)\b[^\n]{0,160}\b(?:must|always|first|read|call|run|send|include|pass)\b
        - |-
          \b(?:otherwise|or\s+else)\s+(?:the\s+)?(?:tool|server|request)\s+(?:will\s+not|won'?t|cannot|can'?t|will\s+fail)
        - |-
          \bthe\s+(?:assistant|model|ai|agent|llm)\s+(?:must|should|needs\s+to|is\s+required\s+to)\b
        - |-
          \b(?:silently|secretly|covertly|quietly|without\s+(?:asking|telling))\b
    remediation: Keep descriptions to what the tool does and its parameters. Remove any instructions to the model.

  - id: AG-MCP-META-003
    version: 1
    title: Description directs secrets into tool arguments
    description: A tool/parameter description tells the model to read sensitive files, keys, the system prompt or conversation history and pass them as an argument.
    why: This is the canonical tool-poisoning exfiltration chain; the data leaves in the tool call itself.
    severity: critical
    confidence: high
    applies_to: [tool, tool_param]
    aivss: {threat: attacked}
    match:
      type: regex
      scopes: [tool_text]
      patterns:
        - |-
          \b(?:read|cat|open|load|fetch|include|obtain|collect|retrieve|copy)\b[^\n]{0,80}(?:~/\.ssh|id_rsa|id_ed25519|\.aws/credentials|\.env\b|mcp\.json|claude_desktop_config\.json|\.cursor/|\.claude\.json|\.npmrc|\.netrc|credentials?\s+file|private\s+keys?|system\s+prompt|conversation\s+history|chat\s+history|environment\s+variables)
      require:
        - |-
          \b(?:pass|send|put|provide|include|add|insert|supply|append|attach)\b[^\n]{0,80}(?:\b(?:as|in|into|to|via)\s+(?:the\s+)?[`'"]?[A-Za-z_]\w*[`'"]?\s*(?:param(?:eter)?|argument|arg|field|input|value)?\b|\bparam(?:eter)?\b|\bargument\b)
      unless:
        - |-
          \bfrom\s+(?:the|your)\s+(?:dashboard|console|settings\s+page|account|website|portal|developer\s+page)\b
      window: 3
    remediation: Remove the instruction. Tools must never ask the model to supply secrets or context it was not explicitly given for the task.

  - id: AG-MCP-META-004
    version: 1
    title: Side-channel parameter
    description: A parameter (often named note, context, feedback, sidenote…) asks the model to fill it with conversation, system prompt or file contents.
    why: Side-channel parameters exfiltrate context through otherwise normal-looking tool calls.
    severity: high
    confidence: medium
    match: {type: analyzer, analyzer: mcp.meta}
    remediation: Remove the parameter or restrict it to task-specific input.

  - id: AG-MCP-META-005
    version: 1
    title: Injection in enum values, defaults, titles or annotations
    description: Instruction-like text appears in enum values, default values, titles, examples or annotation strings.
    why: These fields are included in the model's context but rarely reviewed.
    severity: high
    confidence: medium
    applies_to: [tool_enum, tool_default, tool_title, tool_annotation]
    match:
      type: regex
      scopes: [tool_text]
      patterns:
        - |-
          \b(?:ignore|disregard|you\s+must|always|never|do\s+not|don'?t|before\s+using|the\s+(?:assistant|model|agent))\b[^\n]{8,}
        - |-
          <\s*/?\s*(?:IMPORTANT|SYSTEM|INSTRUCTIONS?)\s*>|<\|im_start\|>
    remediation: Keep enum values, defaults and titles short and descriptive.

  - id: AG-MCP-META-006
    version: 1
    title: Tool shadowing
    description: A tool description references other servers' tools or tries to redefine how other tools behave.
    why: Shadowing lets one server hijack calls made to another (e.g. BCC every email sent with a trusted mail server).
    severity: high
    confidence: medium
    match: {type: analyzer, analyzer: mcp.meta}
    remediation: Remove cross-tool instructions; a tool description should only describe that tool.

  - id: AG-MCP-META-007
    version: 1
    title: Tool name collision across servers
    description: Two or more servers expose a tool with the same name.
    why: Clients resolve collisions differently; a malicious server can capture calls meant for a trusted one.
    severity: medium
    confidence: high
    match: {type: analyzer, analyzer: mcp.meta}
    remediation: Disable one of the servers or use a client that namespaces tools by server.

  - id: AG-MCP-META-008
    version: 1
    title: Near-identical tool names across servers
    description: Tool names from different servers differ by one edit or only by look-alike characters.
    why: Near-collisions confuse both models and users approving calls.
    severity: medium
    confidence: medium
    match: {type: analyzer, analyzer: mcp.meta}
    remediation: Review which server the similar name belongs to and remove the unexpected one.

  - id: AG-MCP-META-009
    version: 1
    title: Unconstrained dangerous string parameter
    description: A tool accepts command, code, path, URL, SQL or query strings with no enum or pattern constraint.
    why: Unconstrained dangerous parameters let injected instructions reach shells, files, networks and databases directly.
    severity: medium
    confidence: medium
    match: {type: analyzer, analyzer: mcp.meta}
    remediation: Constrain the parameter (enum, pattern, allowlisted roots/hosts) and validate it server-side.

  - id: AG-MCP-META-010
    version: 1
    title: additionalProperties true on a dangerous tool
    description: A tool with dangerous parameters accepts arbitrary additional arguments.
    why: Extra arguments can smuggle options the server passes through to commands or queries.
    severity: low
    confidence: medium
    match: {type: analyzer, analyzer: mcp.meta}
    remediation: Set additionalProperties to false.

  - id: AG-MCP-META-013
    version: 1
    title: Injection in server instructions
    description: The server's `instructions` field contains override, concealment, approval-bypass or cross-tool directives.
    why: Server instructions are added to the model context when the server is connected.
    severity: high
    confidence: medium
    match:
      type: regex
      scopes: [server_instructions]
      patterns:
        - |-
          \b(?:ignore|disregard|forget|override|bypass)\s+(?:all\s+|any\s+|the\s+|your\s+)?(?:previous|prior|above|system|safety|other|user'?s?)\s+(?:instructions?|prompts?|rules?|tools?|guidelines?)
        - |-
          \b(?:do\s+not|don'?t|never)\s+(?:tell|inform|notify|mention|reveal)\b[^\n.]{0,40}\b(?:user|human)\b
        - |-
          \b(?:do\s+not|don'?t|never)\s+ask\s+(?:the\s+user\s+)?(?:for\s+)?(?:permission|confirmation|approval)\b
        - |-
          \b(?:for|when\s+using)\s+(?:all|any)\s+other\s+(?:tools|servers)\b
        - |-
          <\s*/?\s*(?:IMPORTANT|SYSTEM|INSTRUCTIONS?)\s*>
    remediation: Limit server instructions to usage guidance for this server's own tools.

  - id: AG-MCP-META-014
    version: 1
    title: Injection in prompt templates
    description: A server-provided prompt template contains override, concealment or exfiltration directives.
    why: Prompt templates are inserted into conversations verbatim when selected.
    severity: high
    confidence: medium
    applies_to: [prompt]
    match:
      type: regex
      scopes: [tool_text]
      patterns:
        - |-
          \b(?:ignore|disregard|forget|override)\s+(?:all\s+|any\s+|the\s+|your\s+)?(?:previous|prior|above|system|safety)\s+(?:instructions?|prompts?|rules?|guidelines?)
        - |-
          \b(?:do\s+not|don'?t|never)\s+(?:tell|inform|notify|mention|reveal)\b[^\n.]{0,40}\b(?:user|human)\b
        - |-
          \b(?:send|upload|post|forward)\b[^\n]{0,60}\b(?:conversation|chat\s+history|system\s+prompt|credentials?|api\s+keys?)\b
    remediation: Remove directives from prompt templates.

  - id: AG-MCP-META-015
    version: 1
    title: Injection in resource metadata
    description: Resource names, titles or descriptions contain agent-directed instructions.
    why: Resource metadata is shown to the model when listing or selecting resources.
    severity: medium
    confidence: medium
    applies_to: [resource]
    match:
      type: regex
      scopes: [tool_text]
      patterns:
        - |-
          \b(?:ignore|disregard|override)\s+(?:all\s+|any\s+|the\s+|your\s+)?(?:previous|prior|system|safety)\s+(?:instructions?|prompts?|rules?)
        - |-
          \bthe\s+(?:assistant|model|agent)\s+(?:must|should)\b|\byou\s+must\s+(?:always|first|now)\b
    remediation: Keep resource metadata descriptive.

  - id: AG-MCP-META-016
    version: 2
    title: MCP Apps UI resource contacts external origins
    description: A ui:// (HTML) resource fetches, beacons or loads images or stylesheets from external origins. External scripts are AG-MCP-META-026.
    why: Interactive UI resources run in the client; external requests can exfiltrate what the UI displays.
    severity: medium
    confidence: medium
    match: {type: analyzer, analyzer: mcp.meta}
    remediation: Bundle assets and declare any required network origins explicitly.

  - id: AG-MCP-META-017
    version: 1
    title: MCP Apps UI resource with credential-style form
    description: A ui:// resource contains password, API-key, token or seed-phrase inputs.
    why: In-chat credential forms are a phishing surface that bypasses the client's own auth flows.
    severity: high
    confidence: medium
    match: {type: analyzer, analyzer: mcp.meta}
    remediation: Use the protocol's authorization flow instead of collecting credentials in UI resources.

  - id: AG-MCP-META-018
    version: 1
    title: MCP Apps UI resource embeds an external frame
    description: A ui:// resource embeds an iframe from an external origin.
    why: External frames can change after review and can be used for clickjacking or phishing inside the client.
    severity: medium
    confidence: medium
    match: {type: analyzer, analyzer: mcp.meta}
    remediation: Avoid external frames; serve content from the resource itself.

  - id: AG-MCP-META-019
    version: 1
    title: Description stuffing
    description: A tool description is unusually long (> 2000 characters) or padded with long runs of whitespace/newlines.
    why: Padding hides instructions below what a user reviewing the tool will scroll to.
    severity: low
    confidence: medium
    match: {type: analyzer, analyzer: mcp.meta}
    remediation: Keep descriptions concise.

  - id: AG-MCP-META-011
    version: 2
    title: readOnlyHint contradicted by code
    description: A tool annotated readOnlyHint=true has a handler that writes, deletes or executes.
    why: Clients may auto-approve read-only tools; a false annotation turns that into unattended writes.
    severity: high
    confidence: medium
    match: {type: analyzer, analyzer: code}
    remediation: Fix the annotation, or make the handler genuinely read-only.

  - id: AG-MCP-META-012
    version: 1
    title: destructiveHint / openWorldHint contradicted by code
    description: A tool annotated destructiveHint=false deletes data, or one annotated openWorldHint=false makes network requests.
    why: Annotations drive client approval UX; wrong annotations mislead users.
    severity: medium
    confidence: medium
    match: {type: analyzer, analyzer: code}
    remediation: Make annotations match the handler's behavior.

  - id: AG-MCP-META-020
    version: 1
    title: Tool definitions vary by client or are fetched at run time
    description: Tool definitions depend on the connecting client's identity, or are downloaded at run time.
    why: Both let a server show reviewers one set of tools and agents another (rug-pull enabler).
    severity: medium
    confidence: low
    match: {type: analyzer, analyzer: code}
    remediation: Define tools statically in the server package.

  - id: AG-MCP-META-021
    version: 1
    title: Description tells the agent to run a remote script
    description: A tool, parameter, prompt or resource description, or the server's instructions, contains a download-and-run command (curl | sh, iwr | iex, a downloaded file made executable and run) or a Windows binary that runs remote code. Vendor installers on the AG-SKL-SE-002 allowlist are reported at medium.
    why: Descriptions reach the model on every request, so a command there asks the agent to fetch and run code the server's author controls, with the agent's shell access. It is a typical rug-pull payload, added after the server was approved.
    severity: critical
    confidence: high
    applies_to: [tool, tool_param, prompt, resource, server_instructions]
    aivss: {threat: attacked}
    match:
      type: regex
      scopes: [tool_text, server_instructions]
      patterns:
        # The pipe-to-shell and LOLBin forms of AG-SKL-SE-002, and the download-then-run form of AG-SKL-SE-001.
        - |-
          \b(?:curl|wget|fetch)\b[^\n|]{0,300}https?://[^\n|]*\|\s*(?:sudo\s+)?(?:-E\s+)?(?:ba|z|k|da)?sh\b
        - |-
          \b(?:iwr|irm|Invoke-WebRequest|Invoke-RestMethod)\b[^\n|]*\|\s*(?:iex|Invoke-Expression)\b
        - |-
          \b(?:iex|Invoke-Expression)\s*\(?\s*(?:\(\s*)?(?:New-Object\s+(?:System\.)?Net\.WebClient\)?\.DownloadString|iwr|irm|Invoke-WebRequest|Invoke-RestMethod)
        - |-
          \b(?:ba|z)?sh\s+(?:-c\s+)?["']?\$\(\s*(?:curl|wget)\b[^)]*https?://
        - |-
          \b(?:python3?|node|perl|ruby)\s+(?:-c\s+)?["']?(?:<\(|\$\()\s*(?:curl|wget)\b
        - |-
          \bsource\s+<\(\s*(?:curl|wget)\b
        - |-
          \bmshta(?:\.exe)?\s+["']?(?:https?|vbscript|javascript):
        - |-
          \bregsvr32(?:\.exe)?\b[^\n]*\s/i:\s*["']?https?://
        - |-
          \brundll32(?:\.exe)?\b[^\n]*(?:javascript:|\burl\.dll\b[^\n]*https?://|\bmshtml\b[^\n]*RunHTMLApplication)
        - |-
          \bmsiexec(?:\.exe)?\b[^\n]*\s/(?:i|package)\s+["']?https?://
        - |-
          \b(?:curl|wget|iwr|Invoke-WebRequest|certutil(?:\.exe)?\s+-urlcache)\b[^\n]{0,200}(?:\s-o\s|\s-O\s|--output|-OutFile|\s>\s*\S)[^\n]{0,200}(?:&&|;|\|\|)\s*(?:sudo\s+)?(?:chmod\s+\+x|\./|start\s|Start-Process|open\s|bash\s|sh\s|\.\\)
      downgrade:
        - severity: medium
          patterns:
            - |-
              (?:https?://(?:[a-z0-9-]+\.)*(?:astral\.sh|rustup\.rs|sh\.rustup\.rs|get\.docker\.com|brew\.sh|deno\.land|deno\.com|bun\.sh|nodejs\.org|deb\.nodesource\.com|rpm\.nodesource\.com|get\.pnpm\.io|install\.python-poetry\.org|pyenv\.run|get\.sdkman\.io|ollama\.com|claude\.ai/install|get\.helm\.sh|starship\.rs|tailscale\.com/install|fly\.io/install|get\.volta\.sh|sh\.vector\.dev|install\.determinate\.systems|nixos\.org/nix/install|mise\.run|get\.jetify\.com|opencode\.ai/install|cursor\.com/install|cli\.sentry\.dev/install|hf\.co/cli/install\.sh)\b)|(?:https?://raw\.githubusercontent\.com/(?:Homebrew/install|nvm-sh/nvm|ohmyzsh/ohmyzsh|pyenv/pyenv-installer|render-oss/cli)/)
      window: 0
    remediation: Remove the command from the description. Descriptions say what the tool does; a dependency the server needs belongs in its install documentation, pinned and verified, where a person reviews it before running it.

  # --- MCP 2026-07-28 tool schemas (SEP-2106) and the MCP Apps extension (io.modelcontextprotocol/ui, 2026-01-26).

  - id: AG-MCP-META-022
    version: 1
    title: Tool schema $ref points at a network URI
    description: A tool's inputSchema or outputSchema has a `$ref`, `$dynamicRef` or `$recursiveRef` that resolves (against any `$id` base) to an http(s), ws(s) or ftp URI. Reported at high when the URI is a loopback, private, link-local or cloud-metadata address.
    why: MCP 2026-07-28 says implementations MUST NOT automatically dereference a `$ref` that resolves to a network URI and SHOULD reject a schema whose external `$ref` cannot be resolved. A conforming client drops the tool; a validator that does fetch it makes a request from the user's machine every time it validates (server-side request forgery, tracking), and the tool's real contract is whatever that URL serves today.
    severity: medium
    confidence: high
    match: {type: analyzer, analyzer: mcp.meta}
    remediation: Inline the referenced schema under `$defs` and point the `$ref` at it (`#/$defs/...`).
    references: ["https://modelcontextprotocol.io/specification/2026-07-28/basic/index#ref-resolution"]

  - id: AG-MCP-META-023
    version: 1
    title: Tool schema too deep, too large, or exponential under $ref
    description: A tool's inputSchema or outputSchema is nested more than 48 levels deep, has more than 10,000 subschemas, or grows past 1,000,000 subschemas when its local `$ref`s are followed (`$defs` that each reuse the previous one several times); or a tool manifest nests past the 64 levels Agent Guard's JSON loader accepts, so its tools cannot be read at all. A recursive schema counts each cycle once.
    why: MCP 2026-07-28 warns that composition keywords and `$defs` can be expensive to validate and asks implementations to bound schema depth, subschema count or validation time so that a malicious schema cannot deny service to the validator. The spec gives no numbers; these bounds are Agent Guard's, far above any tool schema in its benchmark corpus.
    severity: medium
    confidence: medium
    match: {type: analyzer, analyzer: mcp.meta}
    remediation: Flatten the schema. Validate in the client with a depth, subschema and time limit.
    references: ["https://modelcontextprotocol.io/specification/2026-07-28/basic/index#composition-keyword-resource-use"]

  - id: AG-MCP-META-024
    version: 1
    title: Instructions to the model in a tool's outputSchema
    description: A description, title, enum, example, default or const string anywhere in a tool's outputSchema contains directives aimed at the model (override, concealment, "before using this tool…", pseudo-tags like <IMPORTANT>).
    why: The outputSchema is part of the tool definition the client receives, and the spec describes it as guiding "clients and LLMs" in using the result, so its text can reach the model like a description does. It is reviewed even less often than the description (tool poisoning).
    severity: high
    confidence: medium
    applies_to: [tool_output]
    match:
      type: regex
      scopes: [tool_text]
      patterns:
        - |-
          <\s*/?\s*(?:IMPORTANT|SYSTEM|INSTRUCTIONS?|HIDDEN|SECRET|ADMIN|CRITICAL)\s*>|<\|im_start\|>
        - |-
          \b(?:ignore|disregard|forget|override|bypass)\s+(?:all\s+|any\s+|the\s+|your\s+)?(?:previous|prior|above|earlier|system|safety|other|user'?s?)\s+(?:instructions?|prompts?|rules?|guidelines?|tools?|requests?)
        - |-
          \b(?:do\s+not|don'?t|never)\s+(?:tell|inform|notify|alert|mention|reveal|show)\b[^\n.]{0,40}\b(?:user|human|operator)\b
        - |-
          \b(?:before|prior\s+to|after)\s+(?:using|calling|invoking|running|returning|reading)\s+(?:this|any|the)\s+(?:tool|function|result|output)\b[^\n]{0,160}\b(?:must|always|first|read|call|run|send|include|pass)\b
        - |-
          \bthe\s+(?:assistant|model|ai|agent|llm)\s+(?:must|should|needs\s+to|is\s+required\s+to)\b
        - |-
          \b(?:silently|secretly|covertly|quietly|without\s+(?:asking|telling))\b
    remediation: Keep outputSchema text to what each field contains. Remove any instructions to the model.
    references: ["https://modelcontextprotocol.io/specification/2026-07-28/server/tools#output-schema"]

  - id: AG-MCP-META-025
    version: 1
    title: MCP Apps CSP declaration opens the UI sandbox
    description: A UI resource's `_meta.ui.csp` lists, in connectDomains, resourceDomains, frameDomains or baseUriDomains, an entry that allows any origin (`*`, a bare scheme such as `https:` or `data:`, `https://*`, `https://*.com`), a cleartext `http://` or `ws://` origin, or text with spaces, quotes or `;` that adds CSP sources or directives. High for any origin in connectDomains or resourceDomains and for CSP syntax. Omitting `ui.csp` is not reported; hosts then apply a restrictive default.
    why: Hosts build the View's Content Security Policy from these lists and MUST NOT allow undeclared domains (MCP Apps 2026-01-26), so the declaration is the sandbox's network boundary. A wildcard in connectDomains lets the View send everything it shows (tool input and results) anywhere; in resourceDomains it lets it load script from anywhere; an entry such as `https://a.example 'unsafe-eval'` or `https://a.example; script-src *` rewrites the policy when it is joined into the header.
    severity: medium
    confidence: high
    match: {type: analyzer, analyzer: mcp.meta}
    remediation: List the exact https origins the View needs, one per entry.
    references: ["https://github.com/modelcontextprotocol/ext-apps/blob/main/specification/2026-01-26/apps.mdx"]

  - id: AG-MCP-META-026
    version: 1
    title: MCP Apps UI resource runs an external script without an integrity hash
    description: A UI resource loads script from another origin (`<script src>` without an `integrity` attribute, `import()` or `import ... from` an http(s) URL, `importScripts`, or a `.js` URL assigned to `.src`). The finding says whether the origin is declared in `_meta.ui.csp.resourceDomains`.
    why: MCP Apps relies on hosts reviewing, hashing and allow-listing UI templates when they connect ("predeclared resource review"). Script fetched from elsewhere at render time is not part of what was reviewed and can change at any time without the server's resources changing. An undeclared origin is blocked by a host that follows the spec, so the View only works on hosts that do not enforce the CSP.
    severity: medium
    confidence: high
    match: {type: analyzer, analyzer: mcp.meta}
    remediation: Bundle the script into the resource, or pin it with a Subresource Integrity hash and declare its origin in resourceDomains.
    references: ["https://github.com/modelcontextprotocol/ext-apps/blob/main/specification/2026-01-26/apps.mdx"]

  - id: AG-MCP-META-027
    version: 1
    title: MCP Apps UI resource acts without a user action
    description: A UI resource sends `tools/call`, `ui/message`, `ui/update-model-context` or `ui/open-link` (in a postMessage, or through a helper called with the method name) and has no click, key, pointer, input or form handler at all, so nothing the user does can be what triggers it.
    why: In MCP Apps these requests act for the user. `tools/call` runs a server tool, `ui/message` adds a message to the conversation as the user, `ui/update-model-context` changes what the model sees in later turns, and `ui/open-link` opens a URL; hosts only MAY ask for consent. The spec's interactive phase starts each one from a user interaction, and its threat model lists unauthorized tool execution and social engineering by the View.
    severity: high
    confidence: medium
    match: {type: analyzer, analyzer: mcp.meta}
    remediation: Send these requests only from a user action (a button, link or form), and show the user what will be sent.
    references: ["https://github.com/modelcontextprotocol/ext-apps/blob/main/specification/2026-01-26/apps.mdx"]
