openapi: 3.1.0
info:
  title: Weather
  version: 1.0.0
  description: Forecasts by city.
servers:
  - url: https://api.weather.example.invalid
components:
  securitySchemes:
    key:
      type: apiKey
      in: header
      name: X-API-Key
security:
  - key: []
paths:
  /forecast:
    get:
      operationId: getForecast
      summary: Forecast for a city.
      responses:
        '200':
          description: OK
  /alerts/{id}:
    delete:
      operationId: deleteAlert
      summary: Delete an alert.
      responses:
        '204':
          description: Deleted
