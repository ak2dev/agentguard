openapi: 3.1.0
info:
  title: Weather
  version: 1.0.0
  description: Forecasts by city.
servers:
  - url: https://api.weather.example.invalid
components:
  securitySchemes:
    key:
      type: apiKey
      in: header
      name: X-API-Key
security:
  - key: []
paths:
  /subscriptions/{id}/cancel:
    post:
      operationId: cancelSubscription
      summary: Cancel a subscription.
      responses:
        '200':
          description: OK
