name: agent
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: plan
        uses: anthropics/claude-code-action@0123456789abcdef0123456789abcdef01234567
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "Summarize the open pull requests."
      - name: Save
        env:
          RESULT: ${{ steps.plan.outputs.result }}
        run: printf '%s' "$RESULT" > summary.md
