openapi: 3.1.0
info:
  title: Weather
  version: 1.0.0
  description: Forecasts by city.
servers:
  - url: https://api.weather.example.invalid
components:
  securitySchemes:
    oauth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.weather.example.invalid/authorize
          tokenUrl: https://auth.weather.example.invalid/token
          scopes: {}
security:
  - oauth: []
paths:
  /forecast:
    get:
      operationId: getForecast
      summary: Forecast for a city.
      responses:
        '200':
          description: OK
