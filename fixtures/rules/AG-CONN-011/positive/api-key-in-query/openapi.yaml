openapi: 3.1.0
info:
  title: Weather
  version: 1.0.0
  description: Forecasts by city.
servers:
  - url: https://api.weather.example.invalid
components:
  securitySchemes:
    key:
      type: apiKey
      in: query
      name: api_key
security:
  - key: []
paths:
  /forecast:
    get:
      operationId: getForecast
      summary: Forecast for a city.
      responses:
        '200':
          description: OK
